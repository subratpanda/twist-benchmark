 myself emotionally makes sense. I'll do that. BTW, recently I had a setback. Last month I got hurt and had to take a break from pottery, which I use for self-expression and peace."}], "conv-26:v1b5": [{"id": "D10:3", "text": "[20 July, 2023] Caroline: Hey Mel! A lot's happened since we last chatted - I just joined a new LGBTQ activist group last Tues. I'm meeting so many cool people who are as passionate as I am about rights and community support. I'm giving my voice and making a real difference, plus it's fulfilling in so many ways. It's just great, you know?"}], "conv-26:v1b7": [{"id": "D14:33", "text": "[25 August, 2023] Caroline: I'm putting together an LGBTQ art show next month and I'm gonna show my paintings. Super stoked!"}], "conv-26:v1b11": [{"id": "D10:3", "text": "[20 July, 2023] Caroline: Hey Mel! A lot's happened since we last chatted - I just joined a new LGBTQ activist group last Tues. I'm meeting so many cool people who are as passionate as I am about rights and community support. I'm giving my voice and making a real difference, plus it's fulfilling in so many ways. It's just great, you know?"}], "conv-26:v1b13": [{"id": "D19:1", "text": "[22 October, 2023] Caroline: Woohoo Melanie! I passed the adoption agency interviews last Friday! I'm so excited and thankful. This is a big move towards my goal of having a family."}, {"id": "D19:3", "text": "[22 October, 2023] Caroline: Thanks so much, Melanie! It's beautiful! It really brings home how much love's in families - both blood and the ones we choose. I hope to build my own family and put a roof over kids who haven't had that before. For me, adoption is a way of giving back and showing love and acceptance."}], "conv-26:v1b14": [{"id": "D18:5", "text": "[20 October, 2023] Melanie: Yeah, you're right, Caroline. Family's super important to me. Especially after the accident, I've thought a lot about how much I need them. They mean the world to me and I'm so thankful to have them. Thankfully, they enjoyed the Grand Canyon a lot!"}, {"id": "D18:13", "text": "[20 October, 2023] Melanie: Thanks, Caroline. They're a real support. Appreciate them a lot."}], "conv-26:v1b15": [{"id": "D19:1", "text": "[22 October, 2023] Caroline: Woohoo Melanie! I passed the adoption agency interviews last Friday! I'm so excited and thankful. This is a big move towards my goal of having a family."}, {"id": "D19:5", "text": "[22 October, 2023] Caroline: Thanks, Melanie. My dream is to create a safe and loving home for these kids. Love and acceptance should be everyone's right, and I want them to experience it."}], "conv-26:v1b16": [{"id": "D18:5", "text": "[20 October, 2023] Melanie: Yeah, you're right, Caroline. Family's super important to me. Especially after the accident, I've thought a lot about how much I need them. They mean the world to me and I'm so thankful to have them. Thankfully, they enjoyed the Grand Canyon a lot!"}, {"id": "D18:7", "text": "[20 October, 2023] Melanie: Thanks! They were scared but we reassured them and explained their brother would be OK. They're tough kids."}], "conv-26:v1b17": [{"id": "D19:1", "text": "[22 October, 2023] Caroline: Woohoo Melanie! I passed the adoption agency interviews last Friday! I'm so excited and thankful. This is a big move towards my goal of having a family."}, {"id": "D19:7", "text": "[22 October, 2023] Caroline: Thanks, Mel. Finding self-acceptance was a long process, but now I'm ready to offer love and support to those who need it. It's empowering to make a positive difference in someone's life."}], "conv-26:v1b18": [{"id": "D17:10", "text": "[13 October, 2023] Melanie: Thanks, Caroline. It was tough, but I'm doing ok. Been reading that book you recommended a while ago and painting to keep busy."}, {"id": "D18:19", "text": "[20 October, 2023] Melanie: Absolutely! It really helps me reset and recharge. I love camping trips with my fam, 'cause nature brings such peace and serenity."}], "conv-26:v1b19": [{"id": "D16:13", "text": "[13 September, 2023] Caroline: Thanks, Melanie! I made this painting to show my path as a trans woman. The red and blue are for the binary gender system, and the mix of colors means smashing that rigid thinking. It's a reminder to love my authentic self - it's taken a while to get here but I'm finally proud of who I am."}, {"id": "D16:9", "text": "[13 September, 2023] Caroline: Melanie, those bowls are amazing! They each have such cool designs. I love that you chose pottery for your art. Painting and drawing have helped me express my feelings and explore my gender identity. Creating art was really important to me during my transition - it helped me understand and accept myself. I'm so grateful."}], "conv-26:v1b21": [{"id": "D19:1", "text": "[22 October, 2023] Caroline: Woohoo Melanie! I passed the adoption agency interviews last Friday! I'm so excited and thankful. This is a big move towards my goal of having a family."}, {"id": "D17:19", "text": "[13 October, 2023] Caroline: It was a transgender poetry reading where transgender people shared their stories through poetry. It was extra special 'cause it was a safe place for self-expression and it was really empowering to hear others share and celebrate their identities."}], "conv-26:v1b22": [{"id": "D17:8", "text": "[13 October, 2023] Melanie: Thanks for the tip, Caroline. Doing research and readying myself emotionally makes sense. I'll do that. BTW, recently I had a setback. Last month I got hurt and had to take a break from pottery, which I use for self-expression and peace."}, {"id": "D17:12", "text": "[13 October, 2023] Melanie: Yeah, Here's one I did last week. It's inspired by the sunsets. The colors make me feel calm. What have you been up to lately, artistically?"}], "conv-26:v1b23": [{"id": "D10:3", "text": "[20 July, 2023] Caroline: Hey Mel! A lot's happened since we last chatted - I just joined a new LGBTQ activist group last Tues. I'm meeting so many cool people who are as passionate as I am about rights and community support. I'm giving my voice and making a real difference, plus it's fulfilling in so many ways. It's just great, you know?"}, {"id": "D17:19", "text": "[13 October, 2023] Caroline: It was a transgender poetry reading where transgender people shared their stories through poetry. It was extra special 'cause it was a safe place for self-expression and it was really empowering to hear others share and celebrate their identities."}], "conv-26:v1b24": [{"id": "D17:8", "text": "[13 October, 2023] Melanie: Thanks for the tip, Caroline. Doing research and readying myself emotionally makes sense. I'll do that. BTW, recently I had a setback. Last month I got hurt and had to take a break from pottery, which I use for self-expression and peace."}, {"id": "D17:12", "text": "[13 October, 2023] Melanie: Yeah, Here's one I did last week. It's inspired by the sunsets. The colors make me feel calm. What have you been up to lately, artistically?"}], "conv-26:v1b25": [{"id": "D14:33", "text": "[25 August, 2023] Caroline: I'm putting together an LGBTQ art show next month and I'm gonna show my paintings. Super stoked!"}, {"id": "D17:19", "text": "[13 October, 2023] Caroline: It was a transgender poetry reading where transgender people shared their stories through poetry. It was extra special 'cause it was a safe place for self-expression and it was really empowering to hear others share and celebrate their identities."}], "conv-26:v1b26": [{"id": "D17:8", "text": "[13 October, 2023] Melanie: Thanks for the tip, Caroline. Doing research and readying myself emotionally makes sense. I'll do that. BTW, recently I had a setback. Last month I got hurt and had to take a break from pottery, which I use for self-expression and peace."}, {"id": "D17:12", "text": "[13 October, 2023] Melanie: Yeah, Here's one I did last week. It's inspired by the sunsets. The colors make me feel calm. What have you been up to lately, artistically?"}], "conv-26:v1b27": [{"id": "D19:3", "text": "[22 October, 2023] Caroline: Thanks so much, Melanie! It's beautiful! It really brings home how much love's in families - both blood and the ones we choose. I hope to build my own family and put a roof over kids who haven't had that before. For me, adoption is a way of giving back and showing love and acceptance."}, {"id": "D17:19", "text": "[13 October, 2023] Caroline: It was a transgender poetry reading where transgender people shared their stories through poetry. It was extra special 'cause it was a safe place for self-expression and it was really empowering to hear others share and celebrate their identities."}], "conv-30:v1b2": [{"id": "D6:4", "text": "[16 March, 2023] Gina: Thanks, Jon! Appreciate your offer. Since I lost my job at Door Dash, things have been tough. But here's some good news - I've got something to share!"}], "conv-30:v1b3": [{"id": "D15:5", "text": "[19 June, 2023] Jon: The official opening night is tomorrow. I'm working hard to make everything just right. Can't wait to see it all come together!"}], "conv-30:v1b4": [{"id": "D1:2", "text": "[20 January, 2023] Jon: Hey Gina! Good to see you too. Lost my job as a banker yesterday, so I'm gonna take a shot at starting my own business."}, {"id": "D5:10", "text": "[8 February, 2023] Jon: Yeah, I totally agree - taking risks is key for success. It's made me grow, and even got me out of my secure 9-5 as a banker. Now, I'm aiming to turn my dancing passion into a business. I'm determined to make it work, I just know it! That being said, I definitely don't underestimate the difficulties - it ain't been a walk in the park, that's for sure."}], "conv-30:v1b10": [{"id": "D17:2", "text": "[9 July, 2023] Jon: Hey Gina! Congrats on the fashion editors reach-out, that's awesome! Dance practice has been fun and exhausting. I'm gonna stay determined and make my own path by going full-time with my biz idea."}, {"id": "D9:3", "text": "[9 April, 2023] Jon: Thanks, Gina! I'm determined to make this studio work. Losing my job was ive. I got a temp job to help cover expenses while I look for investors. It's tough, but I'm sure it'll be worth it."}], "conv-30:v1b22": [{"id": "D12:3", "text": "[27 May, 2023] Gina: Thanks! I'm excited and kinda nervous. Gonna be a big change. It's part-time position in the fashion department of an international company."}], "conv-30:v1b24": [{"id": "D18:2", "text": "[21 July, 2023] Jon: Hey Gina, congrats on the clothing store! The dance studio is on tenuous grounds right now, but I'm staying positive. I got a temp job to help cover expenses while I look for investors. It's tough, but I'm sure it'll be worth it."}], "conv-30:v1b25": [{"id": "D1:2", "text": "[20 January, 2023] Jon: Hey Gina! Good to see you too. Lost my job as a banker yesterday, so I'm gonna take a shot at starting my own business."}], "conv-30:v1b26": [{"id": "D18:3", "text": "[21 July, 2023] Gina: Thanks, Jon! Appreciate the kind words. Sorry to hear about the studio, but glad to see the positivity. Not easy facing setbacks but I believe in you. Finding investors can be tough, but you've got the passion and experience to make it happen. Rome wasn't built in a day so keep pushing on!"}], "conv-30:v1b28": [{"id": "D19:1", "text": "[23 July, 2023] Jon: Hey Gina! We haven't talked in a few days. Been rehearsing hard and working on business plans. It's been stressful, but dancing has kept me going."}], "conv-41:v1b1": [{"id": "D3:11", "text": "[1 January, 2023] John: Thanks, Maria! I really appreciate your support, It means a lot to me. Especially after I failed the military aptitude test recently, I've been feeling a bit stressed out."}], "conv-41:v1b4": [{"id": "D32:1", "text": "[16 August, 2023] John: Hey Maria! Guess what? I'm now part of the fire-fighting brigade. I'm super excited to be involved and help out my community!"}], "conv-41:v1b8": [{"id": "D29:8", "text": "[9 August, 2023] John: Definitely, Maria! Getting sponsors was difficult. I had to reach out to several businesses through different means, but it paid off. We ended up with some awesome sponsors that made the event a hit."}], "conv-41:v1b9": [{"id": "D28:1", "text": "[5 August, 2023] John: Hey Maria, great chatting with you again! Crazy thing happened since we last talked. I lost my job at the mechanical engineering company. They tanked and it's been really rough. Never saw this coming."}], "conv-41:v1b11": [{"id": "D14:1", "text": "[6 May, 2023] John: Hey Maria, great to chat again! A lot has happened since we last spoke. Last week, I decided to run for office again - even though I haven't been successful before. I guess I can't let go of my dream to make a difference in my community. Can you believe it? Feels like a dream come true!"}], "conv-41:v1b13": [{"id": "D17:12", "text": "[3 June, 2023] Maria: John, that's such a great idea! It gives the pup a loving home and teaches your kids important values. If you need any help, let me know! I just started volunteering at a local dog shelter once a month."}], "conv-41:v1b14": [{"id": "D5:5", "text": "[28 January, 2023] John: It's definitely isn't, Maria. My kids have so much and others don't. We really need to do something about it."}], "conv-41:v1b15": [{"id": "D15:9", "text": "[20 May, 2023] John: I'm really passionate about making sure veterans are supported and valued in our community, so let's make it happen!"}], "conv-41:v1b17": [{"id": "D9:8", "text": "[2 April, 2023] John: Thanks, Maria! Improving education and infrastructure is particularly interesting to me. It's important for our community."}], "conv-41:v1b18": [{"id": "D21:9", "text": "[3 July, 2023] Maria: Yeah, that's important. A safe home is key."}], "conv-41:v1b19": [{"id": "D13:3", "text": "[4 May, 2023] John: I just started going to boot camps with my fam last month. It's good for bonding and getting fit."}], "conv-41:v1b21": [{"id": "D12:5", "text": "[18 April, 2023] John: Recently, education reform and infrastructure development. Good access to quality education and updated infrastructure are key to a thriving and successful community. My goal is to get conversations going and get people involved by sharing ideas and taking action. It's really empowering to know I can help make a difference in people's lives."}], "conv-41:v1b22": [{"id": "D1:3", "text": "[17 December, 2022] Maria: Been busy volunteering at the homeless shelter and keeping fit. Just started doing aerial yoga, it's great. Have you tried any other cool workout classes?"}], "conv-41:v1b24": [{"id": "D26:1", "text": "[31 July, 2023] Maria: Hey John, I'm doing ok - hope you are too. Some interesting stuff has been going on; last week I dropped off that stuff I baked at the homeless shelter. It was great and I'm more motivated than ever to help people."}], "conv-41:v1b27": [{"id": "D18:15", "text": "[12 June, 2023] Maria: Finding my Zen is a mix of things - a moment to myself plus favorite tunes is usually enough. I also enjoy aerial yoga, it's a great way to switch off and focus on my body."}], "conv-41:v1b28": [{"id": "D22:5", "text": "[5 July, 2023] John: I appreciate it. It's really uplifting hearing from you. I sometimes doubt if I'm making a difference, but knowing there's people who understand my work means a lot and helps keep me going. Here's a picture of my family. They motivate me and remind me why I'm doing this."}], "conv-41:v1b29": [{"id": "D28:3", "text": "[5 August, 2023] John: Thanks for your care, Maria. It's been tough but I'm trying to stay up. I've been looking into some opportunities in the tech industry for a while now. Maybe this is the change I need, you gave me the push!"}], "conv-41:v1b31": [{"id": "D21:1", "text": "[3 July, 2023] Maria: Hey John, long time no see! Sorry I didn't get back to you sooner... So much has happened! Check out these kids I met at the shelter!"}], "conv-42:v1b0": [{"id": "D2:21", "text": "[23 January, 2022] Joanna: Oh, its really bad. My face gets all puffy and itchy when I'm around certain animals, so I've always just stayed away."}, {"id": "D2:23", "text": "[23 January, 2022] Joanna: I'm allergic to most reptiles and animals with fur. It can be a bit of a drag, but I find other ways to be happy."}], "conv-42:v1b13": [{"id": "D17:16", "text": "[10 July, 2022] Joanna: That page specifically has some dialogues exploring loss, redemption, and forgiveness. It's a deep and emotional story that I'm really excited about!"}], "conv-42:v1b14": [{"id": "D26:3", "text": "[4 November, 2022] Joanna: Thanks, Nate! The meetings went really well. I felt confident discussing my script and vision and they seemed interested and excited. They loved the elements of self-discovery in it. It was so validating to be taken seriously. I'm feeling hopeful and inspired about the future!"}], "conv-42:v1b15": [{"id": "D25:4", "text": "[25 October, 2022] Joanna: It was an amazing experience! I'll never forget seeing all of the characters and dialogue I wrote being acted out - it was such a cool feeling. Having all the hard work and determination I put into writing pay off was definitely rewarding. I know this is the third time it's happened, but its just so awesome!"}], "conv-42:v1b17": [{"id": "D9:1", "text": "[21 April, 2022] Joanna: Hey Nate! Long time no talk! I wanted to tell ya I just joined a writers group. It's unbelievable--such inspirational people who really get my writing. I'm feeling so motivated and supported, it's like I finally belong somewhere!"}], "conv-42:v1b18": [{"id": "D20:10", "text": "[5 September, 2022] Joanna: Yeah, since I'm lactose intolerant I'm trying out dairy-free options like coconut or almond milk instead. It's been a fun challenge seeing how to make yummy treats that suit everyone's diets. I even made these dairy-free chocolate coconut cupcakes with raspberry frosting."}], "conv-42:v1b19": [{"id": "D26:10", "text": "[4 November, 2022] Nate: What can I say, I love turtles. So, what's been happening with you?"}], "conv-42:v1b22": [{"id": "D24:12", "text": "[21 October, 2022] Joa ore opportunities for young athletes and help them succeed. It's amazing to see the difference sports make in people's lives."}], "conv-43:v1b20": [{"id": "D27:5", "text": "[2 January, 2024] Tim: Wow, traveling is amazing, isn't it? I'm learning German now - tough but fun. Do you know any other languages?"}], "conv-43:v1b21": [{"id": "D18:2", "text": "[16 November, 2023] John: Hey Tim! That's awesome! Yeah, it was really cool. Oh man, it's been a tough week for me with this injury. But I'm staying positive. How about you? How's your week been?"}, {"id": "D24:10", "text": "[16 December, 2023] John: Yeah, I injured myself not too long ago. It sucked because I had to miss some games and couldn't help my team."}], "conv-43:v1b22": [{"id": "D16:1", "text": "[6 November, 2023] Tim: Hey John, long time no see! Hope you've been doing well. Since we last chat, some stuff's happened. Last week, I had a huge writing issue - got stuck on a plot twist and couldn't find my way out. It was crazy frustrating, but I kept pushing and eventually got the ideas flowing again."}], "conv-43:v1b23": [{"id": "D2:4", "text": "[15 June, 2023] John: Thanks! I'm really excited about this new journey! I'm currently considering sports brands like Nike and Under Armour. It would be great to collaborate with brands that are related to sports. However, I'm also open to exploring other brands that align with my values and interests. There are so many options out there, and I can't wait to see where this takes me!"}], "conv-43:v1b24": [{"id": "D16:1", "text": "[6 November, 2023] Tim: Hey John, long time no see! Hope you've been doing well. Since we last chat, some stuff's happened. Last week, I had a huge writing issue - got stuck on a plot twist and couldn't find my way out. It was crazy frustrating, but I kept pushing and eventually got the ideas flowing again."}], "conv-43:v1b26": [{"id": "D10:11", "text": "[31 August, 2023] Tim: Nope, but it's my first time going. I'm super stoked for the Harry Po r its arts and Irish music.", "conv-44:v1c0": "I'd love to have more, but four is enough for now.", "conv-44:v1c1": "I recently joined a dog owners group to learn how to better take care of them.", "conv-44:v1c9": "I got a new place with a bigger backyard for the pooches!", "conv-47:v1c1": "Besides Italy, I was also in Turkey and Mexico.", "conv-47:v1c5": "Yesterday, for example, I was doing rope jumping. The highest height I jumped from was 150 meters!", "conv-47:v1c10": "I never liked cooking, but I felt that I wanted to learn something new.", "conv-48:v1c0": "We're not married yet but we've been together for three years.", "conv-49:v1c5": "trying to stay positive, not easy", "conv-49:v1c8": "limiting myself to just two ginger snaps a day.", "conv-50:v1c5": "Haven't been there before, but it's on my to-do list for after my tour with Frank Ocean ends.", "conv-50:v1c10": "Can't wait to see them in person!", "conv-30:v1d4": "Unfortunately, I also lost my job at Door Dash this month.", "conv-30:v1d5": "I'm turning my loves of dance into a business.", "conv-41:v1d6": "I got promoted at work!", "conv-41:v1d9": "I joined a gym last week! It's been super positive.", "conv-41:v1d12": "I'm volunteering as a mentor for a local school.", "conv-42:v1d3": "Nate, can you believe it? I'm finally filming my own movie from the road-trip script!", "conv-43:v1d4": "I'm stoked for my game there next month!", "conv-44:v1d0": "Nah, still working on that. It's been a bit challenging.", "conv-44:v1d3": "Used to hike a lot, but it's more challenging now with my work life balance.", "conv-44:v1d4": "Woohoo! I got a new place with a bigger backyard for the pooches!", "conv-44:v1d7": "So guess what, I can't help myself but to adpot another dog the other day.", "conv-44:v1d9": "the gf and I are hitting the beach next month with Toby!", "conv-47:v1d3": "I signed up for a cooking class.", "conv-47:v1d6": "Yesterday, for example, I was doing rope jumping.", "conv-48:v1d1": "Honestly, finding that const BANDS=['majority_against','abstain_heavy','majority_match','unanimous_match'];
const BLAB={majority_against:'majority against gold',abstain_heavy:'abstain-heavy',majority_match:'majority match',unanimous_match:'unanimous match'};
const GOLD={contradicting:'contradicts',aligned:'consistent',hard_negative:'consistent'};
let fb=new Set(['majority_against','abstain_heavy']),ft=new Set(['contradicting','aligned','hard_negative']);
document.getElementById('stats').textContent=
 BANDS.map(b=>`${BLAB[b]}: ${DATA.rows.filter(r=>r.band===b).length}`).join(' · ')
 +'  |  '+DATA.kappas.map(k=>`κ ${k.pair}: ${k.value}`).join(' · ');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function chips(el,vals,labels,set){document.getElementById(el).innerHTML=
 vals.map(v=>`<span class="${set.has(v)?'on':''}" onclick="tog('${el}','${v}')">${labels[v]||v}</span>`).join('')}
function tog(el,v){const s=el==='bandchips'?fb:ft;s.has(v)?s.delete(v):s.add(v);render()}
function voteCls(r,n){const v=r.votes[n],g=GOLD[r.type];
 return v===g?'vg':(v==='cannot-tell'?'va':'vr')}
function render(){
 chips('bandchips',BANDS,BLAB,fb);
 chips('typechips',['contradicting','aligned','hard_negative'],{},ft);
 const rows=DATA.rows.filter(r=>fb.has(r.band)&&ft.has(r.type));
 document.getElementById('list').innerHTML=rows.map(r=>{
  const ev=(DATA.evidence[r.id]||[]).map(e=>`<div class="ev">${e.id} — ${esc(e.text)}</div>`).join('');
  const q=DATA.quotes[r.id]?`<div class="quote">gold quote: “${esc(DATA.quotes[r.id])}”</div>`:'';
  const votes=Object.keys(r.votes).map(n=>`<span class="vote ${voteCls(r,n)}">${n.split('-')[0]}: ${r.votes[n]}</span>`).join('');
  const flags=r.flags.length?`<div class="flag">⚑ ${r.flags.map(esc).join(' · ')}</div>`:'';
  return `<div class="card"><span class="band b${BANDS.indexOf(r.band)}">${BLAB[r.band]}</span>
   <span class="meta"> ${r.id} · gold <b>${r.type}</b> (${esc(r.family)}) → expected “${GOLD[r.type]}”</span>
   <div class="draft">${esc(r.draft)}</div>${ev}${q}<div>${votes}</div>${flags}</div>`}).join('')
  ||'<p class="meta">nothing matches the current filters</p>';
}
render();
</script></body></html>
